openapi: "3.1.0"
info:
  title: LeaseRun API
  version: "1.0.0"
  summary: "Vorprüfung, Plausibilisierung und Aufbereitung von Baufinanzierungsfällen."
  description: "REST-API der LeaseRun-Plattform für CRM-, Vermittler-, Bank- und ERP-Systeme. Die API liefert eine Vorprüfung und strukturierte Fallanalyse – keine Kreditzusage, keine Bonitätsentscheidung; die Kreditentscheidung trifft allein das finanzierende Institut.\n\nTarife: Basic ohne API · Pro Standard-API (60 Anfragen/Minute) · Enterprise vollständig inkl. Webhooks und White-Label.\n\nTestumgebung: test_-Schlüssel an derselben Basis-URL; Testdaten sind strikt von Live-Daten getrennt."
  contact:
    name: LeaseRun Support
    email: support@leaserun.com
    url: "https://leaserun.com/b2b"
servers:
  - url: "https://leaserun.com/api/v1"
    description: "Produktion (Test- und Live-Schlüssel)"
tags:
  - name: cases
    description: "Fälle"
  - name: validation
    description: "Vorprüfung"
  - name: documents
    description: Unterlagen
  - name: reports
    description: Berichte
  - name: webhooks
    description: "Webhooks (Enterprise)"
  - name: usage
    description: Nutzung
  - name: keys
    description: "API-Schlüssel"
  - name: health
    description: Status
security:
  - bearerAuth: []
paths:
  /cases:
    post:
      operationId: caseCreate
      summary: Fall anlegen
      description: "Legt einen Finanzierungsfall an. Unbekannte Felder werden abgelehnt (422 VALIDATION_ERROR). external_reference ist je Umgebung eindeutig."
      tags:
        - cases
      security:
        - bearerAuth: []
      x-required-scope: "cases:write"
      parameters:
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CaseInput"
            example:
              external_reference: TEST-0001
              customer:
                first_name: Test
                last_name: "Person (TEST)"
                email: test.person@example.com
                phone: "+49 000 0000000"
              applicants:
                - first_name: Test
                  last_name: "Person (TEST)"
                  employment_type: employed
                  employed_since: "2018-04-01"
                  monthly_net_income: 6000
              property:
                property_type: apartment
                usage: owner_occupied
                address:
                  street: "Teststraße 1 (TEST)"
                  postal_code: "64354"
                  city: Reinheim
                  state: hessen
                purchase_price: 450000
                land_value: 90000
                renovation_cost: 0
                living_area: 92
                year_built: 2004
              household:
                monthly_net_income: 6000
                monthly_expenses: 2200
                adults: 1
                dependants: 0
              equity:
                amount: 100000
                available_amount: 100000
              loan:
                requested_amount: 350000
                term_years: 30
                repayment_rate: 2
                interest_rate: 3.8
              metadata:
                source: leaserun-playground
                test: true
      responses:
        "201":
          description: Fall anlegen
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            X-RateLimit-Limit:
              "$ref": "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Case"
        "401":
          "$ref": "#/components/responses/E401"
        "403":
          "$ref": "#/components/responses/E403"
        "409":
          "$ref": "#/components/responses/E409"
        "422":
          "$ref": "#/components/responses/E422"
        "429":
          "$ref": "#/components/responses/E429"
    get:
      operationId: caseList
      summary: "Fälle auflisten"
      description: "Fälle des Mandanten in der Umgebung des Schlüssels. Filter: ?status=open|action_required|completed, ?external_reference=. Cursor-Paginierung: ?limit=1–100 (Standard 25) und ?cursor=<next_cursor>. Antwort: { object: \"list\", data: [...], pagination: { has_more, next_cursor } }."
      tags:
        - cases
