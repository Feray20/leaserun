components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "test_XXXXXXXX_… | live_XXXXXXXX_…"
      description: "Scopes je Schlüssel: cases:read, cases:write, validation:read, validation:execute, documents:read, documents:write, reports:read, reports:create, webhooks:read, webhooks:write, webhooks:test, usage:read, api_keys:read, api_keys:write. Der benötigte Scope steht je Operation in x-required-scope."
  parameters:
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: next_cursor der vorherigen Seite
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        pattern: "^[A-Za-z0-9_.:-]{8,120}$"
      description: "Gleicher Schlüssel + gleiche Anfrage → gleiche Antwort ohne Duplikat (Header Idempotent-Replayed: true). Gleicher Schlüssel + andere Anfrage → 409 IDEMPOTENCY_CONFLICT. Gültig 24 Stunden."
  headers:
    X-Request-Id:
      schema:
        type: string
      description: "Kennung der Anfrage (bei Support-Anfragen angeben)"
    X-RateLimit-Limit:
      schema:
        type: integer
      description: Anfragen pro Minute laut Tarif
    X-RateLimit-Remaining:
      schema:
        type: integer
    X-RateLimit-Reset:
      schema:
        type: integer
      description: "Unix-Zeit, zu der das Fenster zurückgesetzt wird"
  responses:
    E400:
      description: "Ungültige Anfrage"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    E401:
      description: "Nicht authentifiziert / Schlüssel ungültig, widerrufen, abgelaufen oder deaktiviert"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    E403:
      description: "Nicht freigeschaltet, Tarif enthält die Funktion nicht, Scope fehlt oder IP nicht erlaubt"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    E404:
      description: "Nicht gefunden (auch Ressourcen anderer Mandanten)"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    E409:
      description: "Konflikt (z. B. IDEMPOTENCY_CONFLICT)"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    E413:
      description: "Datei oder Body zu groß"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    E415:
      description: "Dateityp oder Content-Type nicht unterstützt"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    E422:
      description: Validierung fehlgeschlagen
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    E429:
      description: "Rate-Limit überschritten"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
      headers:
        Retry-After:
          schema:
            type: integer
    E500:
      description: Interner Fehler
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    E503:
      description: "Dienst nicht verfügbar oder nicht konfiguriert"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
  schemas:
    CaseInput:
      type: object
      additionalProperties: false
      properties:
        external_reference:
          type: string
          maxLength: 120
        customer:
          type: object
          additionalProperties: false
          properties:
            first_name:
              type: string
              maxLength: 80
            last_name:
              type: string
              maxLength: 80
            email:
              type: string
              format: email
            phone:
              type: string
              pattern: "^[+0-9 ()/-]{5,30}$"
        applicants:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            properties:
              first_name:
                type: string
              last_name:
                type: string
              employment_type:
                enum:
                  - employed
                  - civil_servant
                  - self_employed
                  - retired
                  - other
              employed_since:
                type: string
                format: date
              monthly_net_income:
                type: number
                minimum: 0
        property:
          type: object
          additionalProperties: false
          properties:
            property_type:
              enum:
                - apartment
                - single_family_house
                - two_family_house
                - multi_family_house
                - land
                - other
            usage:
              enum:
                - owner_occupied
                - rented
                - mixed
            address:
              type: object
              additionalProperties: false
              properties:
                street:
                  type: string
                postal_code:
                  type: string
                  pattern: "^\\d{5}$"
                city:
                  type: string
                state:
                  enum:
                    - baden-wuerttemberg
                    - bayern
                    - berlin
                    - brandenburg
                    - bremen
                    - hamburg
                    - hessen
                    - mecklenburg-vorpommern
                    - niedersachsen
                    - "nordrhein-westfalen"
                    - rheinland-pfalz
                    - saarland
                    - sachsen
                    - sachsen-anhalt
                    - schleswig-holstein
                    - thueringen
            purchase_price:
              type: number
              minimum: 0
            land_value:
              type: number
              minimum: 0
            renovation_cost:
              type: number
              minimum: 0
            living_area:
              type: number
              minimum: 0
            year_built:
              type: integer
              minimum: 1500
              maximum: 2100
            monthly_cold_rent:
              type: number
              minimum: 0
        household:
          type: object
          additionalProperties: false
          properties:
            monthly_net_income:
              type: number
              minimum: 0
            monthly_expenses:
              type: number
              minimum: 0
            adults:
              type: integer
              minimum: 1
              maximum: 10
            dependants:
              type: integer
              minimum: 0
              maximum: 20
        equity:
          type: object
          additionalProperties: false
          properties:
            amount:
              type: number
              minimum: 0
            available_amount:
              type: number
              minimum: 0
        loan:
          type: object
          additionalProperties: false
          properties:
            requested_amount:
              type: number
              minimum: 0
            term_years:
              type: integer
              minimum: 1
              maximum: 50
            repayment_rate:
              type: number
              minimum: 0
              maximum: 20
              description: "Anfängliche Tilgung in % p. a."
            interest_rate:
              type: number
              minimum: 0
              maximum: 20
              description: "Sollzins in % p. a. (Annahme 3,8 %, falls leer)"
        metadata:
          type: object
          maxProperties: 20
          additionalProperties:
            type:
              - string
              - number
              - boolean
    Case:
      allOf:
        - "$ref": "#/components/schemas/CaseInput"
        - type: object
          required:
            - id
            - object
            - environment
            - status
            - created_at
          properties:
            id:
              type: string
              format: uuid
            object:
              const: case
            environment:
              enum:
                - test
                - live
            test:
              type: boolean
            status:
              enum:
                - open
                - action_required
                - completed
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    Check:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          examples:
            - LIQUIDITY_GAP
        category:
          type: string
        severity:
          enum:
            - info
            - warning
            - error
        passed:
          type: boolean
        message:
          type: string
        field:
          type:
            - string
            - "null"
        requires_action:
          type: boolean
        value:
          type:
            - number
            - string
            - "null"
        threshold:
          type:
            - number
            - string
            - "null"
      required:
        - code
        - category
        - severity
        - message
        - field
        - requires_action
        - value
        - threshold
    Validation:
      type: object
      required:
        - validation_id
        - status
        - completeness_score
        - missing_documents
        - warnings
        - errors
        - checks
        - evaluated_at
      properties:
        validation_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        object:
          const: validation
        case_id:
          type: string
          format: uuid
        environment:
          enum:
            - test
            - live
        status:
          enum:
            - pending
            - processing
            - completed
            - failed
        completeness_score:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 100
        bank_readiness:
          enum:
            - ready
            - needs_attention
            - "not_ready"
            - null
        missing_documents:
          type: array
          items:
            enum:
              - identity
              - income_proof
              - employment_contract
              - tax_assessment
              - annual_financials
              - bwa
              - equity_proof
              - bank_statement
              - existing_loans
              - expose
              - land_register
              - cadastral_map
              - floor_plan
              - living_area_calculation
              - energy_certificate
              - declaration_of_division
              - owners_meeting_minutes
              - service_charge_statement
              - rental_agreement
              - purchase_contract_draft
              - building_insurance
              - self_disclosure
              - other
        missing_fields:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            "$ref": "#/components/schemas/Check"
        errors:
          type: array
          items:
            "$ref": "#/components/schemas/Check"
        checks:
          type: array
          items:
            "$ref": "#/components/schemas/Check"
        figures:
          type: object
          additionalProperties:
            type:
              - number
              - "null"
        assumptions:
          type: object
        disclaimer:
          type: string
        engine_version:
          type: string
        duration_ms:
          type:
            - integer
            - "null"
        created_at:
          type: string
          format: date-time
        evaluated_at:
          type:
            - string
            - "null"
          format: date-time
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        object:
          const: document
        case_id:
          type: string
          format: uuid
        type:
          enum:
            - identity
            - income_proof
            - employment_contract
            - tax_assessment
            - annual_financials
            - bwa
            - equity_proof
            - bank_statement
            - existing_loans
            - expose
            - land_register
            - cadastral_map
            - floor_plan
            - living_area_calculation
            - energy_certificate
            - declaration_of_division
            - owners_meeting_minutes
            - service_charge_statement
            - rental_agreement
            - purchase_contract_draft
            - building_insurance
            - self_disclosure
            - other
        filename:
          type: string
        mime_type:
          enum:
            - application/pdf
            - image/jpeg
            - image/png
            - image/tiff
        size:
          type: integer
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        status:
          enum:
            - uploaded
            - processing
            - classified
            - verified
            - rejected
            - failed
        classification:
          type:
            - string
            - "null"
        verification_status:
          enum:
            - pending
            - formally_verified
            - rejected
        malware_scan:
          enum:
            - "not_configured"
            - clean
            - infected
            - error
        uploaded_at:
          type: string
          format: date-time
        download_url:
          type:
            - string
            - "null"
        download_expires_at:
          type:
            - string
            - "null"
          format: date-time
    Report:
      type: object
      required:
        - report_id
        - status
      properties:
        report_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        object:
          const: report
        case_id:
          type: string
          format: uuid
        validation_id:
          type:
            - string
            - "null"
        status:
          enum:
            - queued
            - processing
            - completed
            - failed
        branding:
          enum:
            - leaserun
            - white_label
        sha256:
          type:
            - string
            - "null"
        size:
          type:
            - integer
            - "null"
        download_url:
          type:
            - string
            - "null"
        download_expires_at:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
            - string
            - "null"
    WebhookInput:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          pattern: "^https://"
