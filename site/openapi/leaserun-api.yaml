          type: string
          format: uuid
        object:
          const: api_key
        name:
          type: string
        environment:
          enum:
            - test
            - live
        prefix:
          type: string
        masked:
          type: string
        scopes:
          type: array
          items:
            enum:
              - "cases:read"
              - "cases:write"
              - "validation:read"
              - "validation:execute"
              - "documents:read"
              - "documents:write"
              - "reports:read"
              - "reports:create"
              - "webhooks:read"
              - "webhooks:write"
              - "webhooks:test"
              - "usage:read"
              - "api_keys:read"
              - "api_keys:write"
        allowed_ips:
