              - "documents:write"
              - "reports:read"
              - "reports:create"
              - "webhooks:read"
              - "webhooks:write"
              - "webhooks:test"
              - "usage:read"
              - "api_keys:read"
              - "api_keys:write"
        expires_at:
          type: string
          format: date-time
        allowed_ips:
          type: array
          maxItems: 20
          items:
            type: string
      required:
        - name
        - scopes
    ApiKey:
