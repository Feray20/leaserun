name: site-ci
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit -p . 2>&1 | tee ../typecheck.log; exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Tests
        run: npm test 2>&1 | tail -n 400 | tee ../tests.log; exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Build
        run: npm run build 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}
      - name: Report logs as annotations
        if: always()
        working-directory: .
        run: |
          for f in typecheck tests build; do
            [ -f $f.log ] || continue
            if [ $f = build ]; then body=$(grep -nE "rror|Failed|failed|warn  -|Type error|Module not found|Cannot find" $f.log | head -n 120); else body=$(tail -n 120 $f.log); fi
            [ -z "$body" ] && body=$(tail -n 60 $f.log)
            body="${body//'%'/'%25'}"; body="${body//$'\n'/'%0A'}"; body="${body//$'\r'/'%0D'}"
            echo "::warning title=LOG_$f::$body"
          done
