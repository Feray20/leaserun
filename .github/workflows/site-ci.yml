name: site-ci
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit -p . 2>&1 | tee ../typecheck.log; exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Tests
        run: npm test 2>&1 | tail -n 400 | tee ../tests.log; exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Build
        run: npm run build 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}
      - name: Publish logs to ci-logs branch
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/ci && cp typecheck.log tests.log build.log /tmp/ci/ 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/ci/STATUS
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git fetch origin ci-logs --depth 1 && git checkout -f ci-logs || git checkout --orphan ci-logs
          git rm -rfq . >/dev/null 2>&1 || true
          cp /tmp/ci/* . && git add -A && git commit -qm "logs ${{ github.sha }}" && git push -f origin HEAD:ci-logs
